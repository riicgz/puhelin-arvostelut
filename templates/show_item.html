<!DOCTYPE html>
<html>

<head>
  <title>{{ item.title }}</title>
</head>

<body>
  <h1>{{ item.title }}</h1>
  {% if session.user_id == item.user_id %}
  <p>
    <a href="/edit_item/{{ item.id }}">Muokkaa arvostelua</a>
    <a href="/remove_item/{{ item.id }}">Poista arvostelu</a>
  </p>
  {% endif %}
  <p>
    {{ item.description }}
  </p>
  <p>
    Arvio: {{ item.verdict }} €
  </p>
  <p>
    Julkaisija: {{ item.username }}
  </p>
  <p>
    <a href="/">Takaisin</a>
  </p>
</body>

</html>
