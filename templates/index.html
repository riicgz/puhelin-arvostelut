{% extends "layout.html" %}

{% block title %}Matkapuhelin-arvostelut{% endblock %}

{% block content %}
<h2>Arvostelut</h2>

{% for item in items %}
<div class="item">
<a href="/item/{{ item.id }}">{{ item.title }}</a> <br />
Arvostelija: <a href="/user/{{ item.user_id }}">{{ item.username }}</a> <br />
Kommenttien määrä: {{ item.comment_count }}
</div>
{% endfor %}

{% endblock %}
