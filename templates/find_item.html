{% extends "layout.html" %}

{% block title %}Etsi arvostelu{% endblock %}

{% block content %}
<h2>Etsi arvostelu</h2>

<form action="/find_item" method="get">
  <p>
    Etsi: <input type="text" name="query" value="{{ query }}">
  </p>
  <input type="submit" value="Etsi">
</form>

{% if query %}
<h3>Tulokset</h3>

<ul>
  {% for item in results %}
  <li><a href="/find/{{ item.id }}">{{ item.title }}</a></li>
  {% endfor %}
</ul>
{% endif %}
{% endblock %}
